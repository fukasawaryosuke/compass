[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-career"
version = "0.1.0"
description = "Local Obsidian harness for career management"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
compass = "compass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
